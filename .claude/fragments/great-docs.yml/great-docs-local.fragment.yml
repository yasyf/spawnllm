# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: spawnllm
display_name: spawnllm
# Static analysis: at runtime the `call` re-export shadows the `call` module, so
# dynamic introspection cannot resolve `call.call`.
dynamic: false
repo: https://github.com/yasyf/spawnllm
site_url: "https://yasyf.github.io/spawnllm/"
pypi: true

# Mascot-derived palette, per-mode accent for WCAG AA. No gradient/starfield
# extras (busy; the starfield canvas eats homepage clicks) unless asked.
navbar_color: "#181c2b"
accent_color:
  light: "#c2185b"
  dark: "#f48fb1"

# Open Graph / social preview for link unfurls.
social_cards:
  image: docs/assets/social-preview.jpg

hero:
  name: spawnllm
  tagline: "Delete your subprocess wrappers around claude, codex, and gemini."

# Narrative doc sections are optional — dynamic mode generates the API reference
# from docstrings without them. Uncomment and point at docs/ dirs as they appear.
# sections:
#   - title: Getting Started
#     dir: docs/getting-started
#     index: true
#   - title: Guide
#     dir: docs/guide
#     navbar_after: Getting Started
#     index: true

cli:
  enabled: true
  module: spawnllm.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# Curated symbol reference (public API only). The explicit `call.call` path
# sidesteps the module/function name collision that breaks auto-discovery.
reference:
  - title: Calling
    desc: One-shot LLM calls, text and structured.
    contents:
      - call.call
      - call.call_sync
      - extract.extract
      - extract.extract_sync
      - structured.extract_json_block
      - structured.structured_value
  - title: Running
    desc: Spec-driven execution with envelope-aware retry, async and sync.
    contents:
      - run.run
      - run.run_sync
      - RunSpec
      - Response
      - Result
      - Output
      - Error
      - DiscardedAttempt
      - ClaudeConfig
      - CodexConfig
      - GeminiConfig
  - title: Backends
    desc: CLI backends (Claude, Codex, and the Gemini family), the in-process Claude Agent SDK backend, the MLX and OpenAI-endpoint backends, the specialty registry, backend selection, and install/auth status checks.
    contents:
      - LlmBackend
      - CliBackend
      - ClaudeCliBackend
      - ClaudeSdkBackend
      - CodexCliBackend
      - GeminiCliBackend
      - AntigravityCliBackend
      - MlxBackend
      - OpenAiEndpointBackend
      - LlmBackends
      - select_backend
      - BackendStatus
      - BackendReady
      - BackendNotInstalled
      - BackendNotAuthenticated
      - BackendUnavailable
  - title: Transport
    desc: Subprocess plumbing shared by the CLI backends.
    contents:
      - proc.run_cli
      - proc.arun_cli
      - proc.capture_cli
      - proc.acapture_cli
      - proc.collect_process
      - proc.map_concurrent
      - proc.RunResult
  - title: Types
    desc: Shared type aliases.
    contents:
      - types.TModel
      - types.TSpecialty
  - title: MLX
    desc: Local Apple-Silicon engine, adapter codec, fuser, and runtime patches.
    contents:
      - mlx.MlxEngine
      - mlx.AdapterCodec
      - mlx.AdapterFuser
      - mlx.MLXPatches
