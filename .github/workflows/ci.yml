name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build core wasm blob
        run: bash scripts/build_wasm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: core-blob
          path: go/internal/core/spawnllm_core.wasm
          if-no-files-found: error

  test:
    needs: blob
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Download core blob (Go)
        uses: actions/download-artifact@v8
        with:
          name: core-blob
          path: go/internal/core

      - name: Download core blob (Python)
        uses: actions/download-artifact@v8
        with:
          name: core-blob
          path: spawnllm/_core

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Type check (ty)
        continue-on-error: true
        run: uv run ty check spawnllm

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/spawnllm --help

  go:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download core blob
        uses: actions/download-artifact@v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test (race)
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Build (cgo-free)
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  go-lint:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download core blob
        uses: actions/download-artifact@v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (strict conformance, all features)
        working-directory: rust
        env:
          SPAWNLLM_CONFORMANCE_STRICT: "1"
        run: cargo test --workspace --all-features

      - name: Test (spawnllm, no default features)
        working-directory: rust
        run: cargo test -p spawnllm --no-default-features

  vuln:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download core blob
        uses: actions/download-artifact@v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
