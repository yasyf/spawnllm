name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Resolve the core wasm blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build_wasm.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-blob
          path: go/internal/core/spawnllm_core.wasm
          if-no-files-found: error

  test:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download core blob (Go)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: go/internal/core

      - name: Download core blob (Python)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: spawnllm/_core

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Sync (dev)
        run: uv sync --extra dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bdc032fc221459b7b828219c469befbc18ecdd73
          path: .ci-plan-baseline

      - name: Immutable duplicate planning and exact invocation parity
        run: |
          test "$(git -C .ci-plan-baseline rev-parse HEAD)" = bdc032fc221459b7b828219c469befbc18ecdd73
          cp tests/test_cli_plan_reuse.py .ci-plan-baseline/tests/test_cli_plan_reuse.py
          cp spawnllm/_core/spawnllm_core.wasm .ci-plan-baseline/spawnllm/_core/spawnllm_core.wasm
          mkdir -p "$RUNNER_TEMP/plan-old" "$RUNNER_TEMP/plan-new"
          cd .ci-plan-baseline
          if SPAWNLLM_EXPECTED_SOURCE="$PWD" SPAWNLLM_PLAN_OBSERVATIONS="$RUNNER_TEMP/plan-old" PYTHONPATH="$PWD" uv run --project "$GITHUB_WORKSPACE" --no-sync python -m pytest tests/test_cli_plan_reuse.py -q -s -k test_one_expensive_plan_per_attempt > "$RUNNER_TEMP/plan-old.log" 2>&1; then
            cat "$RUNNER_TEMP/plan-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/plan-old.log"
          test "$(grep -Fc 'FAILED tests/test_cli_plan_reuse.py::test_one_expensive_plan_per_attempt[' "$RUNNER_TEMP/plan-old.log")" = 8
          test "$(grep -c 'PLAN_COUNTS .* plans=64 schemas=64 attempts=32$' "$RUNNER_TEMP/plan-old.log")" = 8
          grep -F 'duplicate expensive planning: actual=64 expected=32' "$RUNNER_TEMP/plan-old.log"
          cd "$GITHUB_WORKSPACE"
          SPAWNLLM_EXPECTED_SOURCE="$PWD" SPAWNLLM_PLAN_OBSERVATIONS="$RUNNER_TEMP/plan-new" uv run --no-sync python -m pytest tests/test_cli_plan_reuse.py -q -s
          python - <<'PY_COMPARE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          old = {p.name: p.read_bytes() for p in (root / "plan-old").glob("*.json")}
          new = {p.name: p.read_bytes() for p in (root / "plan-new").glob("*.json")}
          assert len(old) == len(new) == 8, (old.keys(), new.keys())
          assert old == new
          print("PLAN_PARITY old=new:8 cases x32 attempts, args/env/files/output/isolation counts exact")
          PY_COMPARE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-plan-linux-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/plan-old.log
            ${{ runner.temp }}/plan-old/*.json
            ${{ runner.temp }}/plan-new/*.json
          if-no-files-found: error

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.python-version == '3.13'
        with:
          ref: 6a26b9c96af5951bcde6b15d0e4bd47de10964cf
          path: .ci-checkpoint-baseline

      - name: Immutable uncancelled child reproduction and checkpoint reaping
        if: matrix.python-version == '3.13'
        run: |
          test "$(git -C .ci-checkpoint-baseline rev-parse HEAD)" = 6a26b9c96af5951bcde6b15d0e4bd47de10964cf
          if SPAWNLLM_PROC_BEFORE="$GITHUB_WORKSPACE/.ci-checkpoint-baseline/spawnllm/proc.py" uv run pytest tests/test_cli_checkpoint.py -q -s -k test_inflight_checkpoint_reaps_only_its_owned_child > "$RUNNER_TEMP/checkpoint-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/checkpoint-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/checkpoint-negative.log"
          grep -F 'owned child survived request cancellation:' "$RUNNER_TEMP/checkpoint-negative.log"
          uv run pytest tests/test_cli_checkpoint.py -q -s

      - name: Type check (ty)
        continue-on-error: true
        run: uv run ty check spawnllm

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/spawnllm --help

  macos:
    needs: blob
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download core blob (Python)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: spawnllm/_core

      - name: Download core blob (Go)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: go/internal/core

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Sync (dev)
        run: uv sync --extra dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bdc032fc221459b7b828219c469befbc18ecdd73
          path: .ci-plan-baseline

      - name: Immutable duplicate planning and exact invocation parity
        run: |
          test "$(git -C .ci-plan-baseline rev-parse HEAD)" = bdc032fc221459b7b828219c469befbc18ecdd73
          cp tests/test_cli_plan_reuse.py .ci-plan-baseline/tests/test_cli_plan_reuse.py
          cp spawnllm/_core/spawnllm_core.wasm .ci-plan-baseline/spawnllm/_core/spawnllm_core.wasm
          mkdir -p "$RUNNER_TEMP/plan-old" "$RUNNER_TEMP/plan-new"
          cd .ci-plan-baseline
          if SPAWNLLM_EXPECTED_SOURCE="$PWD" SPAWNLLM_PLAN_OBSERVATIONS="$RUNNER_TEMP/plan-old" PYTHONPATH="$PWD" uv run --project "$GITHUB_WORKSPACE" --no-sync python -m pytest tests/test_cli_plan_reuse.py -q -s -k test_one_expensive_plan_per_attempt > "$RUNNER_TEMP/plan-old.log" 2>&1; then
            cat "$RUNNER_TEMP/plan-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/plan-old.log"
          test "$(grep -Fc 'FAILED tests/test_cli_plan_reuse.py::test_one_expensive_plan_per_attempt[' "$RUNNER_TEMP/plan-old.log")" = 8
          test "$(grep -c 'PLAN_COUNTS .* plans=64 schemas=64 attempts=32$' "$RUNNER_TEMP/plan-old.log")" = 8
          grep -F 'duplicate expensive planning: actual=64 expected=32' "$RUNNER_TEMP/plan-old.log"
          cd "$GITHUB_WORKSPACE"
          SPAWNLLM_EXPECTED_SOURCE="$PWD" SPAWNLLM_PLAN_OBSERVATIONS="$RUNNER_TEMP/plan-new" uv run --no-sync python -m pytest tests/test_cli_plan_reuse.py -q -s
          python - <<'PY_COMPARE'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          old = {p.name: p.read_bytes() for p in (root / "plan-old").glob("*.json")}
          new = {p.name: p.read_bytes() for p in (root / "plan-new").glob("*.json")}
          assert len(old) == len(new) == 8, (old.keys(), new.keys())
          assert old == new
          print("PLAN_PARITY old=new:8 cases x32 attempts, args/env/files/output/isolation counts exact")
          PY_COMPARE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-plan-macos-3.14
          path: |
            ${{ runner.temp }}/plan-old.log
            ${{ runner.temp }}/plan-old/*.json
            ${{ runner.temp }}/plan-new/*.json
          if-no-files-found: error

      - name: Test (pytest)
        run: uv run pytest

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: Test (Go)
        working-directory: go
        run: go test -count=1 ./...

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Test (Rust)
        working-directory: rust
        run: cargo test --workspace

  swift:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Test the Apple sidecar
        run: swift test --package-path swift/spawnllm-apple

      - name: Build the Apple sidecar
        run: swift build -c release --package-path swift/spawnllm-apple

      - name: Every request the core plans decodes in the sidecar
        run: |
          python3 - <<'PY'
          import glob, json, subprocess

          binary = "swift/spawnllm-apple/.build/release/spawnllm-apple"
          malformed = "the request on stdin could not be decoded into a sidecar request"
          vectors = sorted(glob.glob("conformance/vectors/plan/apple-*.json"))
          assert vectors, "no apple plan vectors to replay"

          for path in vectors:
              stdin = json.load(open(path))["expected"]["stdin"]
              done = subprocess.run([binary], input=stdin, capture_output=True, text=True)
              print(f"{path}: exit={done.returncode} {done.stdout.strip()}")
              assert done.returncode == 0, (path, done.returncode, done.stderr)
              reply = json.loads(done.stdout)
              assert reply["status"] in {"ok", "error"}, (path, reply)
              assert reply.get("message") != malformed, (path, reply)
          PY

      - name: Probe reports a specific verdict
        run: |
          OUT="$(swift/spawnllm-apple/.build/release/spawnllm-apple --probe)" && CODE=0 || CODE=$?
          printf 'probe exit=%s stdout=%s\n' "$CODE" "$OUT"
          python3 - "$CODE" "$OUT" <<'PY'
          import sys, json
          code, probe = int(sys.argv[1]), json.loads(sys.argv[2])
          assert probe.keys() <= {"available", "reason"}, probe
          assert isinstance(probe["available"], bool), probe
          assert (code == 0) == probe["available"], (code, probe)
          if not probe["available"]:
              assert isinstance(probe["reason"], str) and probe["reason"].strip(), probe
          PY

  descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: Install binrun
        run: go install github.com/yasyf/binrun/cmd/binrun@v0.2.0

      - name: Descriptor parses and is runnable
        run: |
          test -x descriptor/spawnllm-apple.binrun
          head -1 descriptor/spawnllm-apple.binrun | grep -qx '#!/usr/bin/env binrun'
          binrun -- parse descriptor/spawnllm-apple.binrun

      - name: Host copies match the descriptor
        run: bash scripts/sync_descriptor.sh --check

  go:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download core blob
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test (race)
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Build (cgo-free)
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  go-lint:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download core blob
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: go

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (all features)
        working-directory: rust
        run: cargo test --workspace --all-features

      - name: Test (spawnllm, no default features)
        working-directory: rust
        run: cargo test -p spawnllm --no-default-features

  vuln:
    needs: blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download core blob
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-blob
          path: go/internal/core

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
