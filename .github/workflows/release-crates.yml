name: Release (crates.io)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: yasyf/homebrew-tap/.github/actions/verify-tag-on-main@4afbb78f9e1814af04f9686ccf101ecafd5aa295

      - uses: dtolnay/rust-toolchain@stable

      # cargo-edit ships no prebuilt binaries (taiki-e/install-action has no
      # manifest for it either), so this compiles from source.
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Stamp workspace version from tag
        working-directory: rust
        run: cargo set-version --workspace "${GITHUB_REF_NAME#v}"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --allow-dirty
