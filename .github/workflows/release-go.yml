name: Release (Go module)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-go
  cancel-in-progress: false

jobs:
  tag-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: yasyf/homebrew-tap/.github/actions/verify-tag-on-main@4afbb78f9e1814af04f9686ccf101ecafd5aa295

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build core wasm blob
        run: bash scripts/build_wasm.sh

      - name: Test at the release commit
        working-directory: go
        run: go test -race -count=1 ./...

      # The alias tag points at a detached blob-carrying commit so the module zip ships the blob without it ever living on main.
      - name: Create and push the directory-prefixed alias tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f go/internal/core/spawnllm_core.wasm
          git commit -m "release: embed core wasm blob for ${GITHUB_REF_NAME}"
          git tag "go/${GITHUB_REF_NAME}" HEAD
          git push origin "go/${GITHUB_REF_NAME}"

      - name: Warm the module proxy
        run: GOPROXY=https://proxy.golang.org go mod download "github.com/yasyf/spawnllm/go@${GITHUB_REF_NAME}" || true
