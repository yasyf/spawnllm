name: Release (Go module)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-go
  cancel-in-progress: false

jobs:
  tag-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: yasyf/homebrew-tap/.github/actions/verify-tag-on-main@v1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: true

      - name: Test at the release commit
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Create and push the directory-prefixed alias tag
        run: |
          git tag "go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "go/${GITHUB_REF_NAME}"

      - name: Warm the module proxy
        run: GOPROXY=https://proxy.golang.org go mod download "github.com/yasyf/spawnllm/go@${GITHUB_REF_NAME}" || true
