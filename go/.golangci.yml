# golangci-lint v2 config. CI and the prek commit hook run this, and you can run it
# by hand whenever it helps. `golangci-lint fmt`
# applies the formatters; `golangci-lint run` applies the linters.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - prealloc
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      # G204/G304 fire on the dynamic argv/paths that are the point of a CLI
      # launcher; G115 fires on the wazero WASM ABI's 32-bit ptr/len packing.
      excludes:
        - G204
        - G304
        - G115
    revive:
      enable-default-rules: true
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
