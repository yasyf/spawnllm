# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: spawnllm
display_name: spawnllm
parser: google
# Static analysis: at runtime the `call` re-export shadows the `call` module, so
# dynamic introspection cannot resolve `call.call`.
dynamic: false
repo: https://github.com/yasyf/spawnllm
site_url: "https://yasyf.github.io/spawnllm/"
pypi: true
github_style: widget
jupyter: python3

# Conservative defaults: a solid navbar and a single accent, no gradient
# presets or hero starfield. The gradient/starfield extras read as busy and the
# starfield canvas intercepts homepage clicks; keep them off unless asked.
navbar_color: "#1e293b"
accent_color: "#7c3aed"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

hero:
  name: spawnllm
  tagline: "Subshell + MLX LLM-calling backends (Claude/Codex CLI, local MLX) shared across tools."

# Narrative doc sections are optional — dynamic mode generates the API reference
# from docstrings without them. Uncomment and point at docs/ dirs as they appear.
# sections:
#   - title: Getting Started
#     dir: docs/getting-started
#     index: true
#   - title: Guide
#     dir: docs/guide
#     navbar_after: Getting Started
#     index: true

cli:
  enabled: true
  module: spawnllm.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# Curated symbol reference (public API only). The explicit `call.call` path
# sidesteps the module/function name collision that breaks auto-discovery.
reference:
  - title: Calling
    desc: One-shot LLM calls and structured output.
    contents:
      - call.call
      - call.call_sync
      - resolve_schema_path
      - extract_structured
      - parse_structured_output
      - parse_result_envelope
  - title: Running
    desc: Spec-driven execution with envelope-aware retry, async and sync.
    contents:
      - run.run
      - run.run_sync
      - RunSpec
      - RunResult
      - ClaudeConfig
      - CodexConfig
      - GeminiConfig
  - title: Backends
    desc: CLI backends (Claude, Codex, and the Gemini family), the MLX backend, the specialty registry, backend selection, and install/auth status checks.
    contents:
      - LlmBackend
      - CliBackend
      - ClaudeCliBackend
      - CodexCliBackend
      - GeminiCliBackend
      - AntigravityCliBackend
      - MlxBackend
      - LlmBackends
      - select_backend
      - BackendStatus
      - BackendReady
      - BackendNotInstalled
      - BackendNotAuthenticated
      - BackendUnavailable
  - title: Transport
    desc: Subprocess plumbing shared by the CLI backends.
    contents:
      - run_cli
      - arun_cli
      - collect_process
      - map_concurrent
  - title: Types
    desc: Shared type aliases.
    contents:
      - types.TModel
      - types.TSpecialty
  - title: MLX
    desc: Local Apple-Silicon engine, adapter codec, fuser, and runtime patches.
    contents:
      - mlx.MlxEngine
      - mlx.AdapterCodec
      - mlx.AdapterFuser
      - mlx.MLXPatches
