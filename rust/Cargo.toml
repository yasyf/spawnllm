[workspace]
members = ["spawnllm-core", "spawnllm-wasm", "spawnllm", "conformance-gen"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yasyf/spawnllm"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
